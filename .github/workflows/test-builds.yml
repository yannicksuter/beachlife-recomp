name: Clean up PR test build

on:
  pull_request:
    branches: [stable]
    types: [closed]

permissions:
  contents: read

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: test-release-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      # Use the maintained default branch, never execute the closed PR's code.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Remove only this PR's temporary releases
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python tools/release.py cleanup --repository "$GITHUB_REPOSITORY" --pr "$PR_NUMBER"
